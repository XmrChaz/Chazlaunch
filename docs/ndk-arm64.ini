# Example meson cross file for building libwayland-server against the Android
# NDK for arm64-v8a. Adjust NDK and API level to taste.
#
#   meson setup build-android wayland \
#       --cross-file docs/ndk-arm64.ini \
#       -Dscanner=false -Ddocumentation=false -Dtests=false -Dlibraries=true
#
# Set NDK before running:  export NDK=$HOME/Android/Sdk/ndk/27.1.12297006

[constants]
ndk_bin = '/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin'
api = '29'

[binaries]
c = ndk_bin / 'aarch64-linux-android29-clang'
cpp = ndk_bin / 'aarch64-linux-android29-clang++'
ar = ndk_bin / 'llvm-ar'
strip = ndk_bin / 'llvm-strip'
pkgconfig = 'pkg-config'

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

[properties]
needs_exe_wrapper = true
# libffi must be built/installed for arm64 first and visible via PKG_CONFIG_PATH.
